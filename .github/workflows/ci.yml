# desktop-pet CI（评审 P3-12）：offscreen 单测 + 打包冒烟
#
# 说明：
# - 测试与 AST 架构扫描（test_static_constraints）在 ubuntu 上即可跑（QT_QPA_PLATFORM=offscreen）；
#   pynput 全局监听相关用例自带平台守卫，不会在 CI 中真实挂钩子。
# - 打包仅在 push 到 main 时执行并上传产物，作为构建可用性冒烟。

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: pytest (offscreen)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Qt runtime libs (offscreen)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -r requirements.txt

      - name: Run tests (offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests/ -q -p no:cacheprovider

  build:
    name: PyInstaller smoke (Windows)
    runs-on: windows-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build onefile exe
        run: python -m PyInstaller --noconfirm --clean desktop-pet-onefile.spec

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-pet-exe
          path: dist/desktop-pet.exe
